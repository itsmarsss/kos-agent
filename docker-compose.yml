# KOS container jail. Workspace is the only host path the agent can see.
# Secrets stay in a host env file (never inside the workspace).

services:
  kos:
    build: .
    container_name: kos
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    env_file:
      - .env
    environment:
      KOS_WORKSPACE: /workspace
      KOS_HOST: "0.0.0.0"
      KOS_PORT: "4317"
      # Set KOS_DASHBOARD_TOKEN in .env if you publish the port beyond loopback.
      # The secrets vault (docs/secrets.md): KOS_VAULT_KEY in .env is its key,
      # base64 of 32 bytes. Tools still run as KOS's own user here, so the
      # vault stays shut unless .env also sets KOS_VAULT_ALLOW_SHARED_UID=1.
    volumes:
      - ${KOS_HOST_WORKSPACE:-./workspace}:/workspace
      # KOS's own state (the vault, device keys), kept apart from the workspace and its backups.
      - kos-state:/home/kos/.kos
    # No docker.sock, no host network, no privileged.
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

volumes:
  kos-state:
