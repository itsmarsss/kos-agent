name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # search.grep shells out to ripgrep; without it those tests only skip.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Build UI assets
        run: pnpm -C packages/ui build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The container is the mandatory jail once cron runs unattended, so a
      # broken image is a broken product, not just a broken deploy.
      - name: Build container jail
        run: docker build -t kos:ci .

      - name: Verify ripgrep is present in the image
        run: docker run --rm --entrypoint rg kos:ci --version

  # KOS Device: the app on a computer KOS may use. Native, so it builds and
  # tests on macOS, apart from the TypeScript checks above.
  device-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/device-macos
    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      - run: swift build

      - run: swift test

      - name: Bundle the app
        run: ./scripts/bundle.sh
