name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # search.grep shells out to ripgrep; without it those tests only skip.
      # Ubuntu's mirrors are sometimes out of reach from the runners, so the
      # release from GitHub stands in.
      - name: Install ripgrep
        run: |
          if ! (sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep); then
            v=14.1.1
            name=ripgrep-$v-x86_64-unknown-linux-musl
            sha=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
            curl -fsSL --retry 3 -o /tmp/rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/$v/$name.tar.gz"
            echo "$sha  /tmp/rg.tar.gz" | sha256sum -c -
            tar -xzf /tmp/rg.tar.gz -C /tmp
            sudo install /tmp/$name/rg /usr/local/bin/rg
          fi
          rg --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # The extension's test drives the built extension in the runner's Chrome.
      - name: Build KOS for Chrome
        run: pnpm -C packages/browser-extension build

      # Before the tests: the artifact runtime suites read ui/dist/page-lib and skip without it.
      - name: Build UI assets
        run: pnpm -C packages/ui build

      # The *.chrome.test.ts suites skip when no Chrome is found; a runner image without one fails here instead.
      - name: Chrome present
        run: google-chrome --version

      # The suites that drive a real Chrome run apart, one file at a time: Chromes started
      # together on the runner's few cores can take past every launch bound to answer.
      - run: pnpm exec vitest run --exclude '**/*.chrome.test.ts'

      - name: Chrome suites
        run: pnpm exec vitest run --no-file-parallelism .chrome.test.ts

  # The macOS jail (sandbox-exec) and the suites that run under it skip on
  # Linux. HOME is a temp dir so nothing reads the runner's own, by its real
  # path (the jail's deny on the home is by path, and /tmp is a symlink), and
  # Chrome under a stand-in HOME uses a mock keychain (browser/src/chrome.ts).
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The runner's Homebrew Python refuses pip --user (PEP 668); the home suite installs a wheel that way.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc -b

      - name: macOS jail suites
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          home="$(cd "$RUNNER_TEMP/home" && pwd -P)"
          HOME="$home" ./node_modules/.bin/vitest run --testTimeout=30000 \
            packages/harness/src/sandbox \
            packages/harness/src/tools/shell.test.ts \
            packages/harness/src/tools/python.test.ts \
            packages/harness/src/tools/tex.test.ts \
            packages/harness/src/tools/home.test.ts \
            packages/harness/src/files/images.test.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The container is the mandatory jail once cron runs unattended, so a
      # broken image is a broken product, not just a broken deploy.
      - name: Build container jail
        run: docker build -t kos:ci .

      - name: Verify ripgrep is present in the image
        run: docker run --rm --entrypoint rg kos:ci --version

  # KOS for Mac: the app on a computer KOS may use. Native, so it builds and
  # tests on macOS, apart from the TypeScript checks above.
  device-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/device-macos
    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      - run: swift build

      - run: swift test

      - name: Bundle the app
        run: ./scripts/bundle.sh

      # The install and the build lock, on the macOS they are for: the check job's Linux skips the install.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and lock scripts
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run packages/device-macos/scripts/install.test.ts

  # What KOS for Mac and KOS for iPhone share: the wire, the kit and the line.
  device-shared:
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/device-shared
    steps:
      - uses: actions/checkout@v4

      - run: swift test

  # KOS for iPhone: its models and screens tested on macOS, then built for
  # the iOS simulator, which only a runner with Xcode can.
  device-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/device-ios
    steps:
      - uses: actions/checkout@v4

      - run: swift test

      - name: Build for iOS
        run: xcodebuild -scheme PhoneUI -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build
