name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # search.grep shells out to ripgrep; without it those tests only skip.
      # Ubuntu's mirrors are sometimes out of reach from the runners, so the
      # release from GitHub stands in.
      - name: Install ripgrep
        run: |
          if ! (sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep); then
            v=14.1.1
            name=ripgrep-$v-x86_64-unknown-linux-musl
            sha=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
            curl -fsSL --retry 3 -o /tmp/rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/$v/$name.tar.gz"
            echo "$sha  /tmp/rg.tar.gz" | sha256sum -c -
            tar -xzf /tmp/rg.tar.gz -C /tmp
            sudo install /tmp/$name/rg /usr/local/bin/rg
          fi
          rg --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # The extension's test drives the built extension in the runner's Chrome.
      - name: Build KOS for Chrome
        run: pnpm -C packages/browser-extension build

      - run: pnpm test

      - name: Build UI assets
        run: pnpm -C packages/ui build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The container is the mandatory jail once cron runs unattended, so a
      # broken image is a broken product, not just a broken deploy.
      - name: Build container jail
        run: docker build -t kos:ci .

      - name: Verify ripgrep is present in the image
        run: docker run --rm --entrypoint rg kos:ci --version

  # KOS for Mac: the app on a computer KOS may use. Native, so it builds and
  # tests on macOS, apart from the TypeScript checks above.
  device-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/device-macos
    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      - run: swift build

      - run: swift test

      - name: Bundle the app
        run: ./scripts/bundle.sh
