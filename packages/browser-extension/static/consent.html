<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KOS asks to use this Chrome</title>
    <link rel="stylesheet" href="kos.css" />
  </head>
  <body class="consent">
    <header><img src="icon32.png" alt="" width="18" height="18" /><strong>KOS asks to use this Chrome</strong></header>
    <div class="stack">
      <p class="label">For</p>
      <p id="task" class="task"></p>
      <p class="hint">Asked by <span id="requester"></span>. KOS works in a window of its own and in tabs you give it, nowhere else. Click or type in one of its tabs to take over.</p>
      <p class="label">For how long</p>
      <div id="minutes" class="chips"></div>
      <div class="row">
        <button type="button" id="deny" class="btn">Deny</button>
        <button type="button" id="allow" class="btn btn--primary">Allow</button>
      </div>
    </div>
    <script type="module" src="consent.js"></script>
  </body>
</html>
