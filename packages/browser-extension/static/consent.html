<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KOS asks to use this Chrome</title>
    <link rel="stylesheet" href="kos.css" />
    <style>
      body.consent { width: auto; max-width: 420px; margin: 0 auto; padding: 22px 22px 20px; }
      .ask { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
      .halo { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
      .halo::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); filter: blur(12px); opacity: 0.12; animation: glow 1.6s ease-in-out infinite alternate; }
      @keyframes glow { to { opacity: 0.26; } }
      .halo .blob { position: relative; }
      .title { display: flex; flex-direction: column; gap: 5px; }
      .title > strong { font-size: 17px; }
      .task-box {
        width: 100%;
        padding: 12px;
        text-align: left;
        font-size: 13.5px;
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      }
      .ask .section { width: 100%; text-align: left; }
      .ask .row { width: 100%; }
      .count { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body class="consent">
    <div class="ask">
      <div id="halo" class="halo"></div>
      <div class="title">
        <strong>KOS wants to use this Chrome</strong>
        <p class="hint">Asked from <strong id="requester"></strong><span id="kos"></span></p>
      </div>
      <p id="task" class="task-box"></p>
      <div class="section">
        <p class="label">For how long</p>
        <div id="minutes" class="chips"></div>
      </div>
      <p class="hint">KOS works in a window of its own and in tabs you give it, nowhere else. Click or type in one of its tabs to take over; Stop ends it.</p>
      <div class="row">
        <span id="count" class="hint count grow"></span>
        <button type="button" id="deny" class="btn">Deny</button>
        <button type="button" id="allow" class="btn btn--primary">Allow</button>
      </div>
    </div>
    <script type="module" src="consent.js"></script>
  </body>
</html>
