<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KOS</title>
    <link rel="stylesheet" href="kos.css" />
  </head>
  <body>
    <header class="head">
      <img class="face" src="face.svg" alt="" width="36" height="36" />
      <div class="head-text">
        <strong>KOS</strong>
        <span class="sub">Only in sessions you allow.</span>
      </div>
      <span id="pill" class="pill" data-tone="muted">Not paired</span>
    </header>

    <div class="stack">
      <section id="pairing" class="section" hidden>
        <p class="label">Pair with your KOS</p>
        <form id="pair-form" class="card">
          <p class="hint">In KOS: Settings, Devices, Add a device. Paste its link here.</p>
          <label class="field">
            <span>Pairing link</span>
            <input id="link" class="mono" type="text" placeholder="kos-device://pair?url=…&amp;code=…" spellcheck="false" autocomplete="off" required />
          </label>
          <label class="field">
            <span>This Chrome's name in KOS</span>
            <input id="name" type="text" placeholder="Chrome on macOS" spellcheck="false" />
          </label>
          <div class="row"><button type="submit" id="pair" class="btn btn--primary">Pair</button></div>
        </form>
      </section>

      <section id="session" class="card live" hidden>
        <div class="live-head"><strong id="live-title">KOS is using this Chrome</strong><span id="left" class="hint"></span></div>
        <p id="task" class="quote"></p>
        <p class="hint">Asked from <strong id="requester"></strong></p>
        <div class="row">
          <button type="button" id="take" class="btn">Take over</button>
          <button type="button" id="stop" class="btn btn--danger">Stop</button>
        </div>
      </section>

      <section id="this-tab" class="section" hidden>
        <p class="label">This tab</p>
        <div class="card">
          <div class="line">
            <span class="tile"><img id="tab-icon" alt="" hidden /><svg id="tab-glyph" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg></span>
            <div class="line-text"><strong id="tab-title"></strong><span id="tab-host"></span></div>
          </div>
          <button type="button" id="hand" class="btn btn--wide"></button>
        </div>
      </section>

      <section id="paired" class="section" hidden>
        <p class="label">KOS</p>
        <div class="card">
          <div class="line">
            <span id="kos-tile" class="tile" data-tone="muted"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2" /><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M7 7.5h.01M7 16.5h.01" /></svg></span>
            <div class="line-text"><strong id="host"></strong><span id="as"></span></div>
          </div>
          <p id="status-detail" class="hint" hidden></p>
          <hr class="rule" />
          <div class="row">
            <a id="dashboard" class="link grow" target="_blank" rel="noopener">Dashboard</a>
            <button type="button" id="unpair" class="btn btn--danger">Unpair</button>
          </div>
        </div>
        <p class="foot">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-3a2 2 0 0 0-4 0" /></svg>
          <span>KOS works only in its own window and the tabs you give it. Click or type in one of them and it pauses.</span>
        </p>
      </section>

      <p id="error" class="error" hidden></p>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
